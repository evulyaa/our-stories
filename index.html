<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Наши Истории 💖</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-color: #ff4757;
            --text-color: #2f3542;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;

            /* НАСТРОЙКА ФОНА */
            /* Замени ссылку ниже на прямую ссылку изображения с Pinterest (которая начинается на https://i.pinimg.com/...) */
            background-image: url('https://i.pinimg.com/736x/93/32/91/933291c8f55022fe7d88e54fb3681c9f.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Темная вуаль поверх фона для лучшей читаемости */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Карточка заголовка с эффектом полупрозрачного стекла */
        .header-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 22px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .date-badge {
            display: inline-block;
            background: rgba(255, 107, 129, 0.15);
            color: var(--accent-color);
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 0.9em;
            margin-bottom: 12px;
        }

        .main-title {
            font-size: 1.05em;
            line-height: 1.5;
            margin: 0;
            color: #333;
            font-weight: 500;
        }

        .buttons-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Кнопки историй с размытием */
        .story-btn {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #222;
            padding: 18px 20px;
            border-radius: 18px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
        }

        .story-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.98);
        }

        /* Экран чтения истории */
        .story-view {
            display: none;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        .story-title {
            color: var(--accent-color);
            font-size: 1.3em;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }

        .story-content {
            font-size: 1em;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #333;
            margin-bottom: 25px;
        }

        .back-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.35);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Главное меню -->
        <div id="main-menu">
            <div class="header-card">
                <div class="date-badge">💖 22.12.23 💖</div>
                <p class="main-title">
                    Ты сказала, чтобы я написала 1 историю о нас, но я напишу 5 ✨<br><br>
                    Каждую по пунктам, а потом ту, что соберет все пункты вместе 💕
                </p>
            </div>

            <div class="buttons-list">
                <button class="story-btn" onclick="openStory(1)">
                    <span>🌸 Милая</span> <span>➔</span>
                </button>
                <button class="story-btn" onclick="openStory(2)">
                    <span>🍯 Забавная</span> <span>➔</span>
                </button>
                <button class="story-btn" onclick="openStory(3)">
                    <span>☕ Та, что греет сердце</span> <span>➔</span>
                </button>
                <button class="story-btn" onclick="openStory(4)">
                    <span>💫 Которую хочется повторить</span> <span>➔</span>
                </button>
                <button class="story-btn" onclick="openStory(5)">
                    <span>💌 Наша история</span> <span>➔</span>
                </button>
            </div>
        </div>

        <!-- Экран истории -->
        <div id="story-view" class="story-view">
            <h2 id="story-title" class="story-title"></h2>
            <div id="story-content" class="story-content"></div>
            <button class="back-btn" onclick="closeStory()">⬅️ Назад в меню</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Тексты историй
        const stories = {
            1: {
                title: "🌸 Милая история",
                content: "Здесь напиши свою первую милую историю... 💕"
            },
            2: {
                title: "🍯 Забавная история",
                content: "Здесь напиши веселую историю... 😄"
            },
            3: {
                title: "☕ Та, что греет сердце",
                content: "Здесь напиши трогательную историю... ✨"
            },
            4: {
                title: "💫 Которую хочется повторить",
                content: "Здесь напиши про особенный день... 🎆"
            },
            5: {
                title: "💌 Наша история",
                content: "А это главная история, которая объединяет все пункты вместе! 💖"
            }
        };

        function openStory(id) {
            const story = stories[id];
            document.getElementById('story-title').innerText = story.title;
            document.getElementById('story-content').innerText = story.content;
            
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('story-view').style.display = 'block';

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function closeStory() {
            document.getElementById('story-view').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }
    </script>
</body>
</html>
